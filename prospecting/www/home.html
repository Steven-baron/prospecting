{% if not frappe.session.user or frappe.session.user == 'Guest' %}
  <meta http-equiv="refresh" content="0; url=/login?redirect-to=/home">
{% else %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .topbar-logo {
      width: 32px; height: 32px;
      background: #1a1a1a;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
      text-decoration: none;
      transition: background 0.15s;
    }
    .topbar-logo:hover { background: #2a2a2a; }
    .topbar-logo svg { width: 18px; height: 18px; fill: #fff; }
    .topbar-search {
      flex: 1; max-width: 420px; margin: 0 24px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px; height: 34px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
    }
    .topbar-search svg { width: 14px; height: 14px; flex-shrink: 0; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .desk-link {
      font-size: 12px; color: rgba(255,255,255,0.4);
      text-decoration: none; padding: 4px 10px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; transition: all 0.15s;
    }
    .desk-link:hover { color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.25); }
    .topbar-bell { opacity: 0.5; cursor: pointer; }
    .topbar-bell svg { width: 18px; height: 18px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: #e8a838;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #fff;
      cursor: pointer; text-transform: uppercase;
    }

    /* ── App grid ── */
    .launcher {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .app-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 40px 48px;
      justify-content: center;
      max-width: 560px;
    }

    /* ── App tile ── */
    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
    }
    .app-tile:hover .app-icon { transform: scale(1.06); }
    .app-icon {
      width: 96px; height: 96px;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .app-icon svg { width: 44px; height: 44px; }
    .app-label {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      text-align: center;
      letter-spacing: 0.01em;
    }

    /* App colors */
    .app-crm      { background: linear-gradient(145deg, #c026d3, #7c3aed); }
    .app-prospect { background: linear-gradient(145deg, #2563eb, #0ea5e9); }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <a class="topbar-logo" href="/home">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </a>
    <div class="topbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      Search &nbsp;<span style="margin-left:auto;opacity:.4;font-size:11px;">Ctrl+K</span>
    </div>
    <div class="topbar-right">
      <a class="desk-link" href="/desk">Desk</a>
      <div class="topbar-bell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>
      <div class="avatar">{{ (frappe.session.user or 'A')[0] }}</div>
    </div>
  </div>

  <!-- App launcher grid -->
  <div class="launcher">
    <div class="app-grid">

      <a class="app-tile" href="/crm">
        <div class="app-icon app-crm">
          <!-- Frappe CRM funnel icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
        </div>
        <span class="app-label">Frappe CRM</span>
      </a>

      <a class="app-tile" href="/prospecting">
        <div class="app-icon app-prospect">
          <!-- Search / prospecting icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.35-4.35"/>
            <path d="M11 8v6M8 11h6"/>
          </svg>
        </div>
        <span class="app-label">Prospecting</span>
      </a>

    </div>
  </div>

</body>
</html>
{% endif %}
